name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      CI: true
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ReController.sln

      - name: Build (warnings as errors)
        run: dotnet build ReController.sln -c Release --no-restore

      - name: Test
        run: dotnet test ReController.sln -c Release --no-build --logger trx --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

      - name: Publish single-file build
        run: dotnet publish src/ReController.App -p:PublishProfile=win-x64

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: reController-win-x64
          path: artifacts/publish/win-x64/reController.exe
