name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: controller
    attributes:
      label: Controller
      placeholder: e.g. Xbox Series controller over Bluetooth, DualSense over USB
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game / application (if relevant)
  - type: textarea
    id: selftest
    attributes:
      label: Self-test output
      description: Run `reController.exe --selftest` in a terminal and paste the output.
      render: text
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log excerpt
      description: From `%LocalAppData%\reController\logs`. Please review it before posting.
      render: text
